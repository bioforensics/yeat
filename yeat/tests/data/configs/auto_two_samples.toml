[samples.Animal_289]
illumina = "yeat/tests/data/Animal_289_R*.fq.gz"

[samples.short_reads]
illumina = "yeat/tests/data/short_reads_*.fastq.gz"

[assemblers.spades_default]
algorithm = "spades"
arguments = "--isolate"

[global_settings.filter.short]
enabled = false
fastp_args = "--min-length 50 --detect_adapter_for_pe"

[global_settings.downsample.short]
enabled = false
target_depth = 150
target_num_reads = "auto"
genome_size = "auto"
method = "random"
